name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy values so client-side providers can prerender during `next build`.
      # Real secrets are only needed at runtime/deploy.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint . || true  # pre-existing lint debt tracked separately

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
